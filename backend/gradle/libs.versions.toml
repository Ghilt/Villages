# Every version in one place. Spring Boot's own dependency management pins the rest, Jackson 3 and the
# MongoDB driver included, and Occurrent's BOM pins its artifacts. Kotlin is held at the version Spring
# Boot manages its stdlib to, so the compiler and the runtime library agree.

[versions]
java = "21"
kotlin = "2.3.21"
spring-boot = "4.1.1"
occurrent = "0.33.0"
kotest = "6.2.4"
archunit = "1.5.0"
testcontainers = "2.0.5"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
occurrent-bom = { module = "org.occurrent:occurrent-bom", version.ref = "occurrent" }
# Versions come from the Occurrent BOM, so none is written here.
occurrent-eventstore-api = { module = "org.occurrent:occurrent-eventstore-api-blocking" }
occurrent-eventstore-inmemory = { module = "org.occurrent:occurrent-eventstore-inmemory" }
occurrent-application-service = { module = "org.occurrent:occurrent-application-service-blocking" }
occurrent-decider = { module = "org.occurrent:occurrent-decider" }
occurrent-converter-jackson3 = { module = "org.occurrent:occurrent-cloudevent-converter-jackson3" }
occurrent-subscription-api = { module = "org.occurrent:occurrent-subscription-api-blocking" }
occurrent-subscription-inmemory = { module = "org.occurrent:occurrent-subscription-inmemory" }
# Jackson 3 lives under tools.jackson; Spring Boot manages its version.
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-mongodb = { module = "org.testcontainers:testcontainers-mongodb", version.ref = "testcontainers" }
testcontainers-rabbitmq = { module = "org.testcontainers:testcontainers-rabbitmq", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
