# Modules that do not depend on each other are built and tested at the same time. That is safe because each
# module's tests run in a JVM of their own, take a random port when they need one, and write only into a
# temporary folder of their own; docs/TESTING.md holds them to that.
org.gradle.parallel=true

# What a module compiles to is kept in Gradle's build cache, in the user's home and so shared by every tree on the
# machine: a fresh worktree takes its classes from the tree that compiled the same sources, rather than compiling
# buildSrc and eight modules from nothing, which was most of its first start. The tests are kept out of it; see
# buildSrc's villages.kotlin-module. Decision record 0095.
org.gradle.caching=true
